# ============================================================================
# BIO-CLINIC CI/CD Pipeline
# Automatizza build, validazione e deploy del sito su Cloudflare Pages
# ============================================================================

name: Build & Deploy Bio-Clinic

on:
  push:
    branches: [main]
    paths:
      - 'site/data/**'
      - 'site/build/**'
      - 'site/templates/**'
      - 'site/js/**'
      - 'site/css/**'
      - 'site/index.html'
      - 'site/pages/**'
      - 'site/equipe/**'
      - 'site/laboratorio/**'
      - 'site/images/**'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger

env:
  PYTHON_VERSION: '3.11'
  CLOUDFLARE_PROJECT_NAME: 'bio-clinic'

jobs:
  # ===========================================================================
  # JOB 1: Build & Validate
  # ===========================================================================
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jinja2
      
      - name: Run Generator
        working-directory: site
        run: |
          echo "🏗️ Running BIO-CLINIC Generator..."
          python build/generator.py
      
      - name: Validate Schema.org
        working-directory: site
        run: |
          echo "🔍 Validating Schema.org markup..."
          python build/validate_schema.py
      
      - name: Check for warnings
        working-directory: site
        run: |
          echo "⚠️ Checking build warnings..."
          OUTPUT=$(python build/generator.py 2>&1)
          if echo "$OUTPUT" | grep -q "warnings:"; then
            WARNING_COUNT=$(echo "$OUTPUT" | grep -oP '\d+ warnings' | grep -oP '\d+')
            if [ "$WARNING_COUNT" -gt 0 ]; then
              echo "::warning::Build completed with $WARNING_COUNT warnings"
            fi
          fi
          echo "✅ Build check complete"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-pages
          path: |
            site/output/
            site/sitemap.xml
          retention-days: 7

  # ===========================================================================
  # JOB 2: Deploy to Cloudflare Pages (only on main branch push)
  # ===========================================================================
  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    permissions:
      contents: read
      deployments: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jinja2
      
      - name: Run Generator
        working-directory: site
        run: python build/generator.py
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/ --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
      
      - name: Deployment Summary
        run: |
          echo "## 🚀 Cloudflare Pages Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Project**: ${{ env.CLOUDFLARE_PROJECT_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **URL**: https://bio-clinic.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "📅 **Deployed**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 3: Legacy Deploy Script (optional, can be removed)
  # ===========================================================================
  deploy-legacy:
    name: Deploy Legacy (Git Push)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jinja2
      
      - name: Run Generator
        working-directory: site
        run: python build/generator.py
      
      - name: Run Deploy Script
        working-directory: site
        run: |
          echo "🚀 Running deploy script..."
          python build/deploy.py
          echo "✅ Deploy complete!"
      
      - name: Commit generated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "ci: Auto-deploy generated pages [skip ci]"
      
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

  # ===========================================================================
  # JOB 4: Notify (always runs)
  # ===========================================================================
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [build, deploy-cloudflare, deploy-legacy]
    if: always()
    
    steps:
      - name: Build Status Summary
        run: |
          echo "## 📊 Bio-Clinic CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ **Build**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.deploy-cloudflare.result }}" == "success" ]; then
            echo "✅ **Cloudflare Deploy**: Completed" >> $GITHUB_STEP_SUMMARY
            echo "   🌐 URL: https://bio-clinic.pages.dev" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-cloudflare.result }}" == "skipped" ]; then
            echo "⏭️ **Cloudflare Deploy**: Skipped (not main branch or secrets missing)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Cloudflare Deploy**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.deploy-legacy.result }}" == "success" ]; then
            echo "✅ **Legacy Deploy**: Completed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-legacy.result }}" == "skipped" ]; then
            echo "⏭️ **Legacy Deploy**: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Legacy Deploy**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📅 Completed: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
