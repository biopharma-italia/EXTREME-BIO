function init() {
  populateSpecFilters();
  renderStats();
  renderLegend();
  renderCalendar();
}

function populateSpecFilters() {
  const sel = document.getElementById('filterSpec');
  const editSel = document.getElementById('editSpecialty');
  SPECIALTIES.forEach(s => {
    sel.innerHTML += `<option value="${s}">${s.replace(/-/g,' ')}</option>`;
    editSel.innerHTML += `<option value="${s}">${s.replace(/-/g,' ')}</option>`;
  });
  sel.onchange = renderCalendar;
  document.getElementById('filterStatus').onchange = renderCalendar;
  document.getElementById('searchBox').oninput = renderCalendar;
}

function renderStats() {
  const total = articles.length;
  const published = articles.filter(a => a.status === 'published').length;
  const planned = articles.filter(a => a.status === 'planned').length;
  const draft = articles.filter(a => a.status === 'draft').length;
  const specs = [...new Set(articles.map(a => a.specialty))].length;
  const weeks = Math.ceil(total / 5);
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="stat-value">${total}</div><div class="stat-label">Articoli</div></div>
    <div class="stat"><div class="stat-value">${published}</div><div class="stat-label">Pubblicati</div></div>
    <div class="stat"><div class="stat-value">${draft}</div><div class="stat-label">Bozze</div></div>
    <div class="stat"><div class="stat-value">${planned}</div><div class="stat-label">Pianificati</div></div>
    <div class="stat"><div class="stat-value">${specs}</div><div class="stat-label">Specialit&agrave;</div></div>
    <div class="stat"><div class="stat-value">${weeks}</div><div class="stat-label">Settimane</div></div>
    <div class="stat"><div class="stat-value">5/sett</div><div class="stat-label">Frequenza</div></div>
  `;
}

function renderLegend() {
  const used = [...new Set(articles.map(a => a.specialty))];
  document.getElementById('legendBar').innerHTML = used.map(s =>
    `<div class="legend-item"><span class="legend-dot spec-${s}" style="display:inline-block;width:10px;height:10px;border-radius:50%"></span> ${s.replace(/-/g,' ')}</div>`
  ).join('');
}

function renderCalendar() {
  const filterSpec = document.getElementById('filterSpec').value;
  const filterStatus = document.getElementById('filterStatus').value;
  const search = document.getElementById('searchBox').value.toLowerCase();

  let filtered = articles.filter(a => {
    if (filterSpec && a.specialty !== filterSpec) return false;
    if (filterStatus && a.status !== filterStatus) return false;
    if (search && !(a.slug+a.title_h1+a.keyword+a.specialists+a.specialty).toLowerCase().includes(search)) return false;
    return true;
  });

  // Group by month
  const groups = {};
  filtered.forEach(a => {
    const m = a.publish_date.substring(0, 7);
    if (!groups[m]) groups[m] = [];
    groups[m].push(a);
  });

  let html = '';
  Object.keys(groups).sort().forEach(month => {
    const [y, m] = month.split('-');
    const monthName = MONTHS_IT[parseInt(m) - 1] + ' ' + y;
    const count = groups[month].length;

    html += `<div class="month-group">
      <div class="month-header">${monthName} &mdash; ${count} articol${count===1?'o':'i'}</div>
      <table>
        <thead><tr>
          <th style="width:50px">#</th>
          <th style="width:110px">Data</th>
          <th style="width:40px">Stato</th>
          <th style="width:130px">Specialit&agrave;</th>
          <th style="width:200px">Slug</th>
          <th>Titolo H1</th>
          <th style="width:200px">Specialisti</th>
          <th style="width:80px">Azioni</th>
        </tr></thead><tbody>`;

    groups[month].forEach(a => {
      const d = new Date(a.publish_date + 'T00:00:00');
      const dayName = DAYS_IT[d.getDay()];
      const isToday = a.publish_date === TODAY;
      const isPast = a.publish_date < TODAY;
      const rowClass = a.status === 'published' ? 'published' : (isToday ? 'today' : '');
      const statusClass = a.status === 'published' ? 'status-published' : (a.status === 'draft' ? 'status-draft' : 'status-planned');
      const statusLabel = a.status === 'published' ? 'PUB' : (a.status === 'draft' ? 'BOZZA' : 'PLAN');

      html += `<tr class="${rowClass}" data-id="${a.id}">
        <td style="color:#aaa;font-weight:600">${a.id}</td>
        <td class="date-cell">${a.publish_date.substring(5)}<br><span class="day-name">${dayName}</span></td>
        <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
        <td><span class="spec-tag spec-${a.specialty}">${a.specialty.replace(/-/g,' ')}</span></td>
        <td style="font-family:monospace;font-size:.78rem;color:#1565c0">${a.slug}</td>
        <td style="font-weight:500">${a.title_h1}</td>
        <td class="specialists-cell">${a.specialists}</td>
        <td class="actions-cell">
          <button class="btn btn-sm btn-secondary" onclick="editArticle(${a.id})" title="Modifica">&#9998;</button>
          <button class="btn btn-sm btn-danger" onclick="deleteArticle(${a.id})" title="Elimina">&times;</button>
        </td>
      </tr>`;
    });

    html += '</tbody></table></div>';
  });

  if (!filtered.length) {
    html = '<div style="text-align:center;padding:3rem;color:#888;">Nessun articolo trovato con i filtri selezionati.</div>';
  }

  document.getElementById('calendarContainer').innerHTML = html;
}

function editArticle(id) {
  const a = articles.find(x => x.id === id);
  if (!a) return;
  document.getElementById('editId').value = id;
  document.getElementById('editDate').value = a.publish_date;
  document.getElementById('editSlug').value = a.slug;
  document.getElementById('editTitle').value = a.title_h1;
  document.getElementById('editKeyword').value = a.keyword;
  document.getElementById('editSpecialty').value = a.specialty;
  document.getElementById('editSardinia').value = a.sardinia_angle;
  document.getElementById('editSpecialists').value = a.specialists;
  document.getElementById('editStatus').value = a.status;
  document.getElementById('modalTitle').textContent = 'Modifica Articolo #' + id;
  document.getElementById('editModal').classList.add('active');
}

function addArticle() {
  // Find next available date (weekday after last article)
  const lastDate = articles.length ? articles[articles.length - 1].publish_date : TODAY;
  let next = new Date(lastDate + 'T00:00:00');
  do { next.setDate(next.getDate() + 1); } while (next.getDay() === 0 || next.getDay() === 6);
  const nextStr = next.toISOString().substring(0, 10);
  const newId = Math.max(...articles.map(a => a.id)) + 1;

  document.getElementById('editId').value = 'new';
  document.getElementById('editDate').value = nextStr;
  document.getElementById('editSlug').value = '';
  document.getElementById('editTitle').value = '';
  document.getElementById('editKeyword').value = '';
  document.getElementById('editSpecialty').value = 'cardiologia';
  document.getElementById('editSardinia').value = '';
  document.getElementById('editSpecialists').value = '';
  document.getElementById('editStatus').value = 'planned';
  document.getElementById('modalTitle').textContent = 'Nuovo Articolo #' + newId;
  document.getElementById('editModal').classList.add('active');
}

function saveArticle() {
  const idVal = document.getElementById('editId').value;
  const data = {
    publish_date: document.getElementById('editDate').value,
    slug: document.getElementById('editSlug').value.trim(),
    title_h1: document.getElementById('editTitle').value.trim(),
    keyword: document.getElementById('editKeyword').value.trim(),
    specialty: document.getElementById('editSpecialty').value,
    sardinia_angle: document.getElementById('editSardinia').value.trim(),
    specialists: document.getElementById('editSpecialists').value.trim(),
    status: document.getElementById('editStatus').value
  };

  if (!data.slug || !data.title_h1 || !data.publish_date) {
    alert('Compila almeno: Data, Slug e Titolo');
    return;
  }

  if (idVal === 'new') {
    data.id = Math.max(...articles.map(a => a.id)) + 1;
    articles.push(data);
    toast('Articolo #' + data.id + ' aggiunto');
  } else {
    const idx = articles.findIndex(a => a.id === parseInt(idVal));
    if (idx >= 0) {
      data.id = parseInt(idVal);
      articles[idx] = data;
      toast('Articolo #' + data.id + ' aggiornato');
    }
  }

  articles.sort((a, b) => a.publish_date.localeCompare(b.publish_date));
  closeModal();
  renderStats();
  renderLegend();
  renderCalendar();
}

function deleteArticle(id) {
  if (!confirm('Eliminare l\'articolo #' + id + '?')) return;
  articles = articles.filter(a => a.id !== id);
  renderStats();
  renderLegend();
  renderCalendar();
  toast('Articolo #' + id + ' eliminato');
}

function closeModal() { document.getElementById('editModal').classList.remove('active'); }
function closeExportModal() { document.getElementById('exportModal').classList.remove('active'); }
function closeImportModal() { document.getElementById('importModal').classList.remove('active'); }

      url: '/equipe/francesco-dessole/'
    },
    schedule: { frequency: 'daily', days: ['monday','tuesday','wednesday','thursday','friday'], publish_time: '07:00 CET' },
    total_articles: articles.length,
    articles: articles.map(a => ({
      id: a.id,
      publish_date: a.publish_date,
      slug: a.slug,
      keyword: a.keyword,
      title_h1: a.title_h1,
      specialty: a.specialty,
      sardinia_angle: a.sardinia_angle,
      specialists: a.specialists,
      status: a.status
    }))
  };
  document.getElementById('exportContent').value = JSON.stringify(output, null, 2);
  document.getElementById('exportTitle').textContent = 'Esporta JSON — ' + articles.length + ' articoli';
  document.getElementById('exportModal').classList.add('active');
  window._exportFormat = 'json';
}

function exportCSV() {
  let csv = 'ID,Data,Slug,Keyword,Titolo,Specialita,Angolo_Sardegna,Specialisti,Stato\n';
  articles.forEach(a => {
    csv += `${a.id},${a.publish_date},"${a.slug}","${a.keyword}","${a.title_h1}",${a.specialty},"${a.sardinia_angle}","${a.specialists}",${a.status}\n`;
  });
  document.getElementById('exportContent').value = csv;
  document.getElementById('exportTitle').textContent = 'Esporta CSV — ' + articles.length + ' articoli';
  document.getElementById('exportModal').classList.add('active');
  window._exportFormat = 'csv';
}

function copyExport() {
  navigator.clipboard.writeText(document.getElementById('exportContent').value);
  toast('Copiato negli appunti!');
}

function downloadExport() {
  const ext = window._exportFormat || 'json';
  const blob = new Blob([document.getElementById('exportContent').value], { type: ext === 'json' ? 'application/json' : 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'bio-clinic-calendario-90gg.' + ext;
  a.click();
  URL.revokeObjectURL(url);
  toast('File scaricato!');
}

function importJSON() {
  document.getElementById('importContent').value = '';
  document.getElementById('importModal').classList.add('active');
}

function doImport() {
  try {
    const data = JSON.parse(document.getElementById('importContent').value);
    const imported = data.articles || data;
    if (!Array.isArray(imported)) throw new Error('Formato non valido');
    articles = imported.map((a, i) => ({
      id: a.id || i + 1,
      publish_date: a.publish_date || '',
      slug: a.slug || '',
      keyword: a.keyword || '',
      title_h1: a.title_h1 || '',
      specialty: a.specialty || '',
      sardinia_angle: a.sardinia_angle || '',
      specialists: typeof a.specialists === 'string' ? a.specialists : (a.specialists || []).map(s => s.name || s).join(', '),
      status: a.status || 'planned'
    }));
    articles.sort((a, b) => a.publish_date.localeCompare(b.publish_date));
    closeImportModal();
    renderStats();
    renderLegend();
    renderCalendar();
    toast(articles.length + ' articoli importati!');
  } catch (e) {
    alert('Errore: ' + e.message);
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
