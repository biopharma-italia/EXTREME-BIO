name: Deploy Main Site to Cloudflare Pages

# Deploya bio-clinic.it (statico + Pages Functions: booking API, contact, admin).
# Al primo run provisiona anche i secrets runtime (WhatsApp/Resend) sul progetto
# Pages "bio-clinic", recuperandoli in modo sicuro dall'endpoint bootstrap dei
# referti tramite GitHub OIDC (nessun secret in chiaro nel repo).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'functions/**'
      - 'wrangler.toml'
      - 'deploy-cloudflare.sh'
      - '.github/workflows/deploy-main-site.yml'
  workflow_dispatch:
    inputs:
      skip_secrets:
        description: 'Skip secrets provisioning (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write   # GitHub OIDC per il bootstrap secrets (audience referti.bio-clinic.it/cron)

concurrency:
  group: deploy-main-site
  cancel-in-progress: false

jobs:
  deploy-main-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # storia completa: serve a update-sitemap-lastmod.py

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Update sitemap lastmod from git history
        run: python3 scripts/update-sitemap-lastmod.py || true

      - name: Provision runtime secrets (WhatsApp + Resend) via OIDC
        if: github.event.inputs.skip_secrets != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Requesting GitHub OIDC token..."
          OIDC_JSON=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=referti.bio-clinic.it/cron")
          OIDC_TOKEN=$(echo "$OIDC_JSON" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')

          echo "Fetching shared secrets from referti bootstrap endpoint (retry: referti deploy may be in flight)..."
          for i in $(seq 1 10); do
            RESP=$(curl -sS -X POST \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              "https://referti.bio-clinic.it/api/cron/export-secrets" || echo '{}')
            if echo "$RESP" | python3 -c 'import sys,json;d=json.load(sys.stdin);exit(0 if d.get("success") else 1)' 2>/dev/null; then
              break
            fi
            echo "  attempt $i failed, retrying in 30s..."
            sleep 30
          done

          WASENDER=$(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["secrets"]["WASENDER_API_KEY"] or "")')
          RESEND=$(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["secrets"]["RESEND_API_KEY"] or "")')

          if [ -n "$WASENDER" ]; then
            printf '%s' "$WASENDER" | wrangler pages secret put WASENDER_API_KEY --project-name=bio-clinic
            echo "WASENDER_API_KEY set on project bio-clinic"
          else
            echo "WARNING: WASENDER_API_KEY not available from bootstrap endpoint"
          fi

          if [ -n "$RESEND" ]; then
            printf '%s' "$RESEND" | wrangler pages secret put EMAIL_API_KEY --project-name=bio-clinic
            echo "EMAIL_API_KEY set on project bio-clinic"
          else
            echo "WARNING: RESEND_API_KEY not available from bootstrap endpoint"
          fi

      - name: Apply D1 booking schema (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Schema con CREATE TABLE IF NOT EXISTS + INSERT OR IGNORE: sicuro da ri-applicare
          wrangler d1 execute bio-clinic-booking --remote \
            --file=site/docs/d1-booking-schema.sql || {
              echo "WARNING: D1 schema apply failed (API continua a funzionare in modalita' KV/fallback)"
            }

      - name: Deploy to Cloudflare Pages (static + functions)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash deploy-cloudflare.sh

      - name: Smoke test API live
        run: |
          sleep 20
          echo "=== /api/booking/ping ==="
          PING=$(curl -sS "https://bio-clinic.it/api/booking/ping")
          echo "$PING"
          echo "$PING" | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["ok"];print("storage mode:",d["storage"]["mode"])'
          echo "=== /api/booking/services ==="
          curl -sS "https://bio-clinic.it/api/booking/services" | head -c 300
          echo ""
          echo "Smoke test PASSED"

      - name: Ping IndexNow (Bing/Yandex) per le pagine modificate
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        run: |
          python3 scripts/seo/indexnow_submit.py --changed-since "${{ github.event.before }}" || \
            echo "WARNING: IndexNow ping fallito (non blocca il deploy)"

      - name: Summary
        run: |
          echo "## Main Site Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Static site + Pages Functions deployed to project bio-clinic" >> $GITHUB_STEP_SUMMARY
          echo "- Live: https://bio-clinic.it" >> $GITHUB_STEP_SUMMARY
