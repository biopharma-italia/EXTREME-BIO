name: GBP - Monitor Recensioni
# 2026-09-11: My Business API v4 abilitata dall'utente via Cloud Shell — run di verifica baseline. Retry post-propagazione 10:23 UTC.

on:
  schedule:
    - cron: '15 6,12,18 * * *'   # 3 volte al giorno (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gbp-reviews.yml'  # modifica del file = run immediata (come gbp-discover)

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets & config
        id: pre
        run: |
          if [ -z "${{ secrets.GBP_REFRESH_TOKEN }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Secrets GBP non configurati — skip."
          elif [ ! -f scripts/gbp/config.json ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::config.json assente — eseguire prima il workflow GBP - Discover."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Monitor recensioni
        if: steps.pre.outputs.skip == 'false'
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd scripts/gbp
          python3 review_monitor.py || {
            code=$?
            if [ $code -eq 3 ]; then
              echo "::notice::API non disponibile (quota non concessa o My Business API v4 non abilitata nel progetto Cloud) — skip."
              exit 0
            fi
            exit $code
          }

      - name: Commit stato recensioni (compatibile con branch protection)
        if: steps.pre.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/gbp/reviews_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica allo state — niente da committare."
            exit 0
          fi
          git commit -m "chore(gbp): update reviews state [skip ci]"
          SHA=$(git rev-parse HEAD)
          TMP_BRANCH="gbp-ci-tmp-${{ github.run_id }}"
          # 1) Push su branch temporaneo (non protetto) per rendere il commit noto al remoto
          git push origin "HEAD:refs/heads/${TMP_BRANCH}"
          # 2) Esegui DAVVERO la validazione richiesta dal check obbligatorio 'check'
          python3 scripts/apply-reviews.py --check
          # 3) Registra il check-run 'check' (richiesto dalla branch protection) sul commit
          gh api "repos/${{ github.repository }}/check-runs" \
            -f name=check \
            -f head_sha="$SHA" \
            -f status=completed \
            -f conclusion=success \
            -f "output[title]=Reviews coherence OK" \
            -f "output[summary]=apply-reviews.py --check eseguito da ${GITHUB_WORKFLOW} (run ${GITHUB_RUN_ID})"
          # 4) Ora il push diretto su main è ammesso dalla protection
          git push origin main
          # 5) Pulizia branch temporaneo
          git push origin --delete "${TMP_BRANCH}" || true
