name: GBP - Discover (setup iniziale)

# Da lanciare MANUALMENTE una volta, appena Google approva l'accesso API.
# Scopre account/location e committa scripts/gbp/config.json.
# 2026-09-11: email Google ricevuta — allowlist APPROVATA (progetto 762256014734, quota 300 QPM).

on:
  workflow_dispatch:
  schedule:
    - cron: '35 7 * * *'   # test giornaliero 09:35 ita: appena Google approva, il discover passa e committa config.json
  push:
    branches: [main]
    paths:
      - '.github/workflows/gbp-discover.yml'  # test: modifica del file = tentativo discover

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.GBP_REFRESH_TOKEN }}" ]; then
            echo "::error::Secrets GBP non configurati."
            exit 1
          fi

      - name: Discover account e location
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
        run: |
          cd scripts/gbp
          python3 discover.py

      - name: Mostra config generato
        run: |
          echo "=== scripts/gbp/config.json ==="
          cat scripts/gbp/config.json

      - name: Upload config come artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbp-config
          path: scripts/gbp/config.json

      - name: Commit config (best-effort — la branch protection può bloccare il bot)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/gbp/config.json
          if git diff --cached --quiet; then
            echo "config.json già aggiornato nel repo — niente da committare."
          else
            git commit -m "chore(gbp): discover account/location [skip ci]"
            git push || echo "::warning::Push bloccato dalla branch protection. Scarica l'artifact 'gbp-config' e committa manualmente scripts/gbp/config.json."
          fi
