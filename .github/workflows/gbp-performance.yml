name: GBP - Report Performance Mensile

on:
  schedule:
    - cron: '0 7 1 * *'   # 1° del mese, 07:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'Giorni da analizzare'
        default: '30'
        required: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets & config
        id: pre
        run: |
          if [ -z "${{ secrets.GBP_REFRESH_TOKEN }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Secrets GBP non configurati — skip."
          elif [ ! -f scripts/gbp/config.json ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::config.json assente — eseguire prima GBP - Discover."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Pull performance
        if: steps.pre.outputs.skip == 'false'
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          PYTHONPATH=scripts/gbp python3 scripts/gbp/pull_performance.py --days "${{ github.event.inputs.days || '30' }}" || {
            code=$?
            if [ $code -eq 3 ]; then
              echo "::notice::Quota API non ancora concessa."
              exit 0
            fi
            exit $code
          }

      - name: Commit report
        if: steps.pre.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bio-clinic-analisi/gbp-data/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(gbp): report performance mensile [skip ci]"
          git push || true
