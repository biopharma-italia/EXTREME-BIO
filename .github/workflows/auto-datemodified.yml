name: Auto-update dateModified & Deploy

on:
  schedule:
    - cron: '0 6 */2 * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''
      skip_deploy:
        description: 'Skip Cloudflare deploy (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "date=$(TZ='Europe/Rome' date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Update dateModified on all pages
        run: |
          python3 scripts/update-date-modified.py --date "${{ steps.date.outputs.date }}"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(auto): update dateModified to ${{ steps.date.outputs.date }}"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin main

      - name: Install Wrangler
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.skip_deploy != 'true'
        run: npm install -g wrangler@latest

      - name: Deploy to Cloudflare Pages
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.skip_deploy != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bash deploy-cloudflare.sh

      - name: Summary
        run: |
          echo "## dateModified Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: ${{ steps.date.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes detected**: ${{ steps.changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
