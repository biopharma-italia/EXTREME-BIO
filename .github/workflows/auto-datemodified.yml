#!/usr/bin/env python3

import os
import re
import sys
import argparse
from datetime import datetime
from pathlib import Path

# -------------------------------
# Utility
# -------------------------------

def iso_datetime(date_str):
    return f"{date_str}T00:00:00+01:00"

def italian_date(date_str):
    dt = datetime.strptime(date_str, "%Y-%m-%d")
    return dt.strftime("%d/%m/%Y")

# -------------------------------
# Update Logic
# -------------------------------

def update_file(filepath, iso_value, italian_value):
    modified = False

    try:
        content = filepath.read_text(encoding="utf-8")

        # JSON-LD dateModified
        new_content = re.sub(
            r'"dateModified"\s*:\s*"[^"]+"',
            f'"dateModified": "{iso_value}"',
            content
        )

        # Meta article:modified_time
        new_content = re.sub(
            r'<meta property="article:modified_time" content="[^"]+" ?/?>',
            f'<meta property="article:modified_time" content="{iso_value}" />',
            new_content
        )

        # Visible badge (if exists)
        new_content = re.sub(
            r'(Aggiornato il|Ultimo aggiornamento:)\s*\d{2}/\d{2}/\d{4}',
            lambda m: f"{m.group(1)} {italian_value}",
            new_content
        )

        if new_content != content:
            filepath.write_text(new_content, encoding="utf-8")
            modified = True

    except Exception as e:
        print(f"❌ Error processing {filepath}: {e}")
        raise

    return modified

# -------------------------------
# Main
# -------------------------------

def main():
    parser = argparse.ArgumentParser(description="Update dateModified across site pages")
    parser.add_argument("--date", required=True, help="Date in YYYY-MM-DD format")
    args = parser.parse_args()

    date_str = args.date
    iso_value = iso_datetime(date_str)
    italian_value = italian_date(date_str)

    site_dir = Path("site")

    if not site_dir.exists():
        print("❌ Site directory not found.")
        sys.exit(1)

    print("=" * 60)
    print(f"Date: {date_str} ({italian_value})")
    print(f"ISO full: {iso_value}")
    print(f"Site dir: {site_dir.resolve()}")
    print("=" * 60)

    total_pages = 0
    modified_count = 0

    for filepath in site_dir.rglob("*.html"):
        total_pages += 1
        if update_file(filepath, iso_value, italian_value):
            modified_count += 1

    print(f"Total pages scanned: {total_pages}")
    print(f"Modified: {modified_count}")

    if modified_count == 0:
        print("ℹ️ No pages required updating.")
        sys.exit(0)

    print("✅ Update completed successfully.")
    sys.exit(0)


if __name__ == "__main__":
    main()
