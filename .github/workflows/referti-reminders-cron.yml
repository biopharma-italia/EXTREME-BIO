name: Referti - Promemoria WhatsApp (cron)

# Chiama l'endpoint /api/cron/send-reminders ogni ora, autenticandosi con
# un token OIDC di GitHub Actions (nessun secret di repository necessario).
# L'endpoint verifica firma RS256 (JWKS GitHub), issuer, audience, repository
# e branch main. In alternativa accetta ancora X-Cron-Secret.
#
# L'endpoint applica lato server la finestra oraria 09-19 Europe/Rome,
# quindi le chiamate fuori orario sono no-op sicure.
# Max 20 promemoria per esecuzione, 1 promemoria per referto (soglia 24h).

on:
  schedule:
    - cron: '0 * * * *'   # ogni ora al minuto 0 (UTC)
  workflow_dispatch: {}    # trigger manuale per test
  push:
    branches: [main]
    paths:
      - '.github/workflows/referti-reminders-cron.yml'  # smoke test automatico quando il workflow cambia

permissions:
  contents: read
  id-token: write          # necessario per richiedere il token OIDC

concurrency:
  group: referti-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ottieni token OIDC e invia promemoria
        run: |
          set -euo pipefail

          # 1) Richiedi il token OIDC con audience dedicata
          OIDC_JSON=$(curl -sS --max-time 30 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=referti.bio-clinic.it/cron")
          OIDC_TOKEN=$(echo "$OIDC_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::Impossibile ottenere il token OIDC"
            exit 1
          fi

          # 2) Chiama l'endpoint cron con il token OIDC come Bearer
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST \
            'https://referti.bio-clinic.it/api/cron/send-reminders' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --max-time 240)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP $HTTP_CODE"
          echo "$BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Cron promemoria fallito con HTTP $HTTP_CODE"
            exit 1
          fi

          # 3) Retry delle notifiche WhatsApp di rilascio fallite (rate limit ecc.)
          #    Stesso token OIDC; endpoint applica finestra 09-19, backoff 60min,
          #    max 10/run, stop immediato su nuovo rate limit.
          RETRY_RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST \
            'https://referti.bio-clinic.it/api/cron/retry-failed-notifications' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            --max-time 240)
          RETRY_CODE=$(echo "$RETRY_RESPONSE" | tail -n1)
          RETRY_BODY=$(echo "$RETRY_RESPONSE" | sed '$d')
          echo "retry-failed HTTP $RETRY_CODE"
          echo "$RETRY_BODY"
          if [ "$RETRY_CODE" -ne 200 ]; then
            # Non fallire il job: i promemoria sono già stati inviati con successo
            echo "::warning::retry-failed-notifications ha risposto HTTP $RETRY_CODE"
          fi

          # 4) Richieste recensione Google post-download (30-90 min dopo il
          #    download del referto). Finestra 09-19, max 5/run, cooldown
          #    180gg per paziente, skip referti anomali/urgenti, stop su
          #    rate limit. Best-effort: non fallire il job.
          REVIEW_RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST \
            'https://referti.bio-clinic.it/api/cron/review-request' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            --max-time 240)
          REVIEW_CODE=$(echo "$REVIEW_RESPONSE" | tail -n1)
          REVIEW_BODY=$(echo "$REVIEW_RESPONSE" | sed '$d')
          echo "review-request HTTP $REVIEW_CODE"
          echo "$REVIEW_BODY"
          if [ "$REVIEW_CODE" -ne 200 ]; then
            echo "::warning::review-request ha risposto HTTP $REVIEW_CODE"
          fi

# retrigger: 2026-08-25 primo run review-request post-deploy
