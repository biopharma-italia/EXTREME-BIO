<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portale Lavoratore | Bio-Clinic MDL</title>
  <meta name="description" content="Portale Lavoratore - Sorveglianza Sanitaria D.Lgs. 81/2008">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/mdl.css?v=20260611d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .pl-hero{background:linear-gradient(135deg,var(--primary),#0066b3);color:#fff;padding:2rem;border-radius:12px;margin-bottom:1.5rem}
    .pl-hero h1{font-size:1.5rem;margin:0 0 .3rem}
    .pl-hero p{margin:0;opacity:.85;font-size:.9rem}
    .pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}
    .pl-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:1.25rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
    .pl-card h3{font-size:1rem;margin:0 0 .75rem;display:flex;align-items:center;gap:.5rem}
    .pl-card .card-icon{font-size:1.3rem}
    .pl-empty{color:#9ca3af;font-size:.85rem;text-align:center;padding:1.5rem}
    .pl-info-row{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid #f3f4f6;font-size:.85rem}
    .pl-info-row:last-child{border-bottom:none}
    .pl-info-label{color:#6b7280;min-width:130px}
    .pl-info-value{font-weight:500;text-align:right}
    .pl-visit-item{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #f3f4f6;font-size:.85rem}
    .pl-visit-item:last-child{border-bottom:none}
    .pl-fitness-big{text-align:center;padding:1rem 0}
    .pl-fitness-big .semaforo{font-size:2.5rem}
    .pl-fitness-big .judgment{font-size:1.05rem;font-weight:600;margin-top:.3rem}
    .pl-scadenza-row{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #f3f4f6;font-size:.85rem}
    .pl-scadenza-row:last-child{border-bottom:none}
    .pl-nav{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1.25rem;background:#fff;border-bottom:1px solid #e5e7eb}
    .pl-nav img{height:28px}
    .pl-footer{text-align:center;padding:2rem 1rem;color:#9ca3af;font-size:.78rem}
    .pl-tabs{display:flex;gap:0;background:#fff;border-radius:10px 10px 0 0;box-shadow:0 1px 3px rgba(0,0,0,.05);border-bottom:2px solid var(--gray-200);overflow-x:auto;margin-bottom:0}
    .pl-tab{padding:.65rem 1.1rem;font-size:.82rem;font-weight:500;color:var(--gray-500);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;font-family:var(--font);white-space:nowrap}
    .pl-tab:hover{color:var(--gray-700)}
    .pl-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
    .pl-panel{display:none;background:#fff;border-radius:0 0 10px 10px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:1.25rem}
    .pl-panel.active{display:block}
    .pl-alert{display:flex;align-items:flex-start;gap:.75rem;padding:.85rem 1rem;border-radius:8px;font-size:.85rem;margin-bottom:1rem}
    .pl-alert-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
    .pl-alert-warning{background:#fef3c7;border:1px solid #fde68a;color:#92400e}
    .pl-alert-danger{background:#fee2e2;border:1px solid #fecaca;color:#991b1b}
    .pl-alert-icon{font-size:1.2rem;flex-shrink:0;margin-top:.1rem}
    .pl-training-item{display:flex;justify-content:space-between;align-items:center;padding:.55rem 0;border-bottom:1px solid #f3f4f6;font-size:.85rem}
    .pl-training-item:last-child{border-bottom:none}
    @media(max-width:768px){
      .pl-grid{grid-template-columns:1fr}
      .pl-hero{padding:1.25rem}
      .pl-hero h1{font-size:1.2rem}
      .pl-tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}
    }
    @media(max-width:480px){
      .pl-tab{padding:.55rem .75rem;font-size:.78rem}
    }
  </style>
</head>
<body style="background:#f9fafb">

  <!-- Login -->
  <div id="loginPage" class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <img src="/images/logo-bio-clinic.png" alt="Bio-Clinic" width="160">
        <h2>Portale Lavoratore</h2>
        <p class="login-subtitle">Sorveglianza Sanitaria &mdash; D.Lgs. 81/2008</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="email@azienda.it" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="Password" required autocomplete="current-password">
        </div>
        <div id="loginError" class="login-error"></div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block" style="width:100%">Accedi</button>
      </form>
      <div style="margin-top:1rem;text-align:center;font-size:.82rem">
        <a href="/portale-azienda/" style="color:var(--primary)">Portale Azienda &rarr;</a>
        <span style="margin:0 .5rem;color:var(--gray-300)">|</span>
        <a href="/dashboard/" style="color:var(--primary)">Accesso operatori &rarr;</a>
      </div>
    </div>
  </div>

  <!-- App -->
  <div id="appShell" class="d-none" style="min-height:100vh;display:flex;flex-direction:column">
    <nav class="pl-nav">
      <img src="/images/logo-bio-clinic.png" alt="Bio-Clinic">
      <div style="display:flex;align-items:center;gap:1rem">
        <span id="userNameDisplay" style="font-size:.85rem;font-weight:500"></span>
        <button class="btn btn-outline btn-sm" id="logoutBtn">Esci</button>
      </div>
    </nav>

    <main style="flex:1;max-width:1000px;width:100%;margin:0 auto;padding:1.5rem 1rem">
      <div id="portaleContent">
        <div style="text-align:center;padding:3rem;color:#9ca3af">Caricamento dati...</div>
      </div>
    </main>

    <footer class="pl-footer">
      Bio-Clinic S.r.l. &mdash; Portale Lavoratore &mdash; Medicina del Lavoro D.Lgs. 81/2008
    </footer>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script>
  (function () {
    'use strict';
    var API = '/api';
    var state = { session: null, user: null, worker: null };

    function $(id) { return document.getElementById(id); }
    function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    function show(el) { if (typeof el === 'string') el = $(el); if (el) el.classList.remove('d-none'); }
    function hide(el) { if (typeof el === 'string') el = $(el); if (el) el.classList.add('d-none'); }

    function toast(msg, type) {
      var c = $('toastContainer'); if (!c) return;
      var t = document.createElement('div');
      t.className = 'toast toast-' + (type || 'info');
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(function () { if (t.parentNode) t.remove(); }, 4000);
    }

    function api(method, path, body) {
      var opts = { method: method, headers: {} };
      if (state.session) opts.headers['Authorization'] = 'Bearer ' + state.session.access_token;
      if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      return fetch(API + path, opts).then(function (r) {
        if (r.status === 401) { clearSession(); showLogin(); throw new Error('Sessione scaduta'); }
        return r.json().then(function (data) {
          if (!r.ok) throw new Error(data.error || 'Errore');
          return data;
        });
      });
    }

    function fmtDate(d) {
      if (!d) return '—';
      return new Date(d).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function daysUntil(dateStr) {
      if (!dateStr) return null;
      var now = new Date(); now.setHours(0,0,0,0);
      var target = new Date(dateStr); target.setHours(0,0,0,0);
      return Math.ceil((target - now) / 86400000);
    }

    // ── Auth ──
    function loadSession() {
      try {
        var s = localStorage.getItem('mdl_session');
        var u = localStorage.getItem('mdl_user');
        if (s && u) { state.session = JSON.parse(s); state.user = JSON.parse(u); return true; }
      } catch (e) {}
      return false;
    }
    function saveSession(ses, usr) {
      state.session = ses; state.user = usr;
      localStorage.setItem('mdl_session', JSON.stringify(ses));
      localStorage.setItem('mdl_user', JSON.stringify(usr));
    }
    function clearSession() {
      state.session = null; state.user = null; state.worker = null;
      localStorage.removeItem('mdl_session'); localStorage.removeItem('mdl_user');
    }
    function showLogin() { show('loginPage'); hide('appShell'); }
    function showApp() { hide('loginPage'); show('appShell'); loadPortaleData(); }

    // Auto-refresh
    var refreshTimer = null;
    function startAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(function () {
        if (!state.session || !state.session.refresh_token) return;
        fetch(API + '/auth/refresh', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: state.session.refresh_token })
        }).then(function (r) { return r.json(); }).then(function (r) {
          if (r.success && r.session) {
            state.session.access_token = r.session.access_token;
            state.session.refresh_token = r.session.refresh_token;
            localStorage.setItem('mdl_session', JSON.stringify(state.session));
          }
        }).catch(function () {});
      }, 50 * 60 * 1000);
    }

    // ── Labels ──
    var FITNESS_LABELS = {
      idoneo: 'Idoneo', idoneo_con_prescrizioni: 'Idoneo con prescrizioni',
      idoneo_con_limitazioni: 'Idoneo con limitazioni', temporaneamente_non_idoneo: 'Temp. non idoneo',
      non_idoneo: 'Non idoneo'
    };
    var FITNESS_COLORS = {
      idoneo: '#16a34a', idoneo_con_prescrizioni: '#ca8a04', idoneo_con_limitazioni: '#ea580c',
      temporaneamente_non_idoneo: '#dc2626', non_idoneo: '#dc2626'
    };
    var VISIT_LABELS = {
      preventiva: 'Preventiva', periodica: 'Periodica', straordinaria: 'Straordinaria',
      cambio_mansione: 'Cambio Mansione', rientro_malattia: 'Rientro Malattia',
      cessazione: 'Cessazione', pre_assuntiva: 'Pre-Assuntiva'
    };
    var STATUS_LABELS = {
      programmata: 'Programmata', completata: 'Completata', non_presentato: 'Non presentato', annullata: 'Annullata'
    };
    var TRAINING_LABELS = {
      generale_4h: 'Generale 4h', specifica_basso_4h: 'Specifica Basso 4h',
      specifica_medio_8h: 'Specifica Medio 8h', specifica_alto_12h: 'Specifica Alto 12h',
      aggiornamento_6h: 'Aggiornamento 6h', preposti_8h: 'Preposti 8h',
      dirigenti_16h: 'Dirigenti 16h', rls_32h: 'RLS 32h',
      primo_soccorso_16h: 'Primo Soccorso 16h', antincendio_livello1: 'Antincendio L1',
      antincendio_livello2: 'Antincendio L2', antincendio_livello3: 'Antincendio L3',
      carrellisti: 'Carrellisti', altro: 'Altro'
    };

    // ── Data ──
    var cache = { workerDetail: null, training: [], visits: [] };

    function loadPortaleData() {
      $('userNameDisplay').textContent = (state.user.first_name || '') + ' ' + (state.user.last_name || '');

      // Step 1: Find self worker record
      api('GET', '/workers?limit=1').then(function (r) {
        if (!r.data || r.data.length === 0) {
          $('portaleContent').innerHTML = '<div class="pl-hero"><h1>Benvenuto/a, ' + esc(state.user.first_name) + '</h1>' +
            '<p>Il tuo profilo lavoratore non &egrave; ancora stato associato. Contatta la segreteria.</p></div>';
          return;
        }
        var worker = r.data[0];

        // Load all data in parallel
        var p1 = api('GET', '/workers/' + worker.id).then(function (d) { cache.workerDetail = d.data; });
        var p2 = api('GET', '/training?limit=50').then(function (d) { cache.training = d.data || []; }).catch(function () { cache.training = []; });
        var p3 = api('GET', '/visits?limit=50').then(function (d) { cache.visits = d.data || []; }).catch(function () { cache.visits = []; });

        Promise.all([p1, p2, p3]).then(function () {
          renderPortale();
        }).catch(function (e) {
          $('portaleContent').innerHTML = '<div style="color:#dc2626;padding:2rem;text-align:center">Errore: ' + esc(e.message) + '</div>';
        });
      }).catch(function (e) {
        $('portaleContent').innerHTML = '<div style="color:#dc2626;padding:2rem;text-align:center">Errore: ' + esc(e.message) + '</div>';
      });
    }

    function renderPortale() {
      var data = cache.workerDetail;
      if (!data || !data.worker) {
        $('portaleContent').innerHTML = '<div class="pl-empty">Nessun dato disponibile</div>';
        return;
      }

      var w = data.worker;
      var currentJob = (w.mdl_worker_jobs || []).find(function (j) { return j.is_current; });
      var roleName = currentJob && currentJob.mdl_job_roles ? currentJob.mdl_job_roles.role_name : '—';
      var companyName = w.mdl_companies ? w.mdl_companies.business_name : '—';
      var fitness = data.currentFitness;
      var visits = cache.visits;
      var judgments = data.fitnessJudgments || [];
      var training = cache.training;

      var html = '';

      // Hero
      html += '<div class="pl-hero">' +
        '<h1>Benvenuto/a, ' + esc(w.first_name) + ' ' + esc(w.last_name) + '</h1>' +
        '<p>' + esc(companyName) + ' &mdash; Mansione: ' + esc(roleName) + '</p>' +
      '</div>';

      // Alerts
      html += renderAlerts(fitness, visits);

      // Tabs
      html += '<div class="pl-tabs">' +
        '<button class="pl-tab active" data-tab="tab-panoramica">Panoramica</button>' +
        '<button class="pl-tab" data-tab="tab-visite">Visite Mediche</button>' +
        '<button class="pl-tab" data-tab="tab-idoneita">Idoneit&agrave;</button>' +
        '<button class="pl-tab" data-tab="tab-formazione">Formazione</button>' +
        '<button class="pl-tab" data-tab="tab-dati">I Miei Dati</button>' +
      '</div>';

      // Tab: Panoramica
      html += '<div id="tab-panoramica" class="pl-panel active">';
      html += '<div class="pl-grid">';
      html += renderFitnessCard(fitness);
      html += renderNextVisitCard(fitness, visits);
      html += renderScadenzeCard(fitness, visits);
      html += renderProtocolCard(data);
      html += '</div></div>';

      // Tab: Visite
      html += '<div id="tab-visite" class="pl-panel">';
      html += renderVisitePanel(visits);
      html += '</div>';

      // Tab: Idoneita
      html += '<div id="tab-idoneita" class="pl-panel">';
      html += renderIdoneitaPanel(fitness, judgments);
      html += '</div>';

      // Tab: Formazione
      html += '<div id="tab-formazione" class="pl-panel">';
      html += renderFormazionePanel(training);
      html += '</div>';

      // Tab: Dati
      html += '<div id="tab-dati" class="pl-panel">';
      html += renderDatiPanel(w, currentJob, companyName, roleName);
      html += '</div>';

      $('portaleContent').innerHTML = html;
      initTabs();
    }

    // ── Alerts ──
    function renderAlerts(fitness, visits) {
      var html = '';
      // Check fitness expiry
      if (fitness && fitness.next_visit_date) {
        var days = daysUntil(fitness.next_visit_date);
        if (days !== null && days < 0) {
          html += '<div class="pl-alert pl-alert-danger"><span class="pl-alert-icon">&#9888;</span><div><strong>Idoneit&agrave; scaduta</strong><br>La tua idoneit&agrave; &egrave; scaduta da ' + Math.abs(days) + ' giorni. Contatta il medico competente per programmare una nuova visita.</div></div>';
        } else if (days !== null && days <= 30) {
          html += '<div class="pl-alert pl-alert-warning"><span class="pl-alert-icon">&#9888;</span><div><strong>Idoneit&agrave; in scadenza</strong><br>La tua idoneit&agrave; scade tra ' + days + ' giorni (' + fmtDate(fitness.next_visit_date) + ').</div></div>';
        }
      }
      // Check next programmed visit
      var programmate = visits.filter(function (v) { return v.status === 'programmata'; });
      if (programmate.length > 0) {
        var next = programmate[0];
        html += '<div class="pl-alert pl-alert-info"><span class="pl-alert-icon">&#128197;</span><div><strong>Visita programmata</strong><br>' +
          fmtDate(next.scheduled_date) +
          (next.scheduled_time ? ' ore ' + next.scheduled_time.slice(0, 5) : '') +
          ' &mdash; ' + esc(VISIT_LABELS[next.visit_type] || next.visit_type) +
          (next.location ? ' presso ' + esc(next.location) : '') +
        '</div></div>';
      }
      return html;
    }

    // ── Cards ──
    function renderFitnessCard(fitness) {
      var html = '<div class="pl-card">' +
        '<h3><span class="card-icon">&#9889;</span> Idoneit&agrave; Attuale</h3>';
      if (fitness) {
        var color = FITNESS_COLORS[fitness.judgment_type] || '#6b7280';
        html += '<div class="pl-fitness-big">' +
          '<div class="semaforo" style="color:' + color + '">&#9679;</div>' +
          '<div class="judgment" style="color:' + color + '">' + esc(FITNESS_LABELS[fitness.judgment_type] || fitness.judgment_type) + '</div>' +
        '</div>';
        html += '<div class="pl-info-row"><span class="pl-info-label">Data emissione</span><span class="pl-info-value">' + fmtDate(fitness.issued_date) + '</span></div>';
        if (fitness.next_visit_date) {
          var days = daysUntil(fitness.next_visit_date);
          var urgStyle = days !== null && days < 0 ? 'color:#dc2626;font-weight:600' : days !== null && days <= 30 ? 'color:#ca8a04;font-weight:600' : '';
          html += '<div class="pl-info-row"><span class="pl-info-label">Prossima visita</span><span class="pl-info-value" style="' + urgStyle + '">' + fmtDate(fitness.next_visit_date) + (days !== null ? ' (' + days + 'gg)' : '') + '</span></div>';
        }
        if (fitness.prescriptions) {
          html += '<div style="margin-top:.5rem;padding:.5rem .75rem;background:#fef3c7;border-radius:6px;font-size:.82rem"><strong>Prescrizioni:</strong> ' + esc(fitness.prescriptions) + '</div>';
        }
        if (fitness.limitations) {
          html += '<div style="margin-top:.35rem;padding:.5rem .75rem;background:#fee2e2;border-radius:6px;font-size:.82rem"><strong>Limitazioni:</strong> ' + esc(fitness.limitations) + '</div>';
        }
      } else {
        html += '<div class="pl-empty">Nessuna idoneit&agrave; registrata</div>';
      }
      html += '</div>';
      return html;
    }

    function renderNextVisitCard(fitness, visits) {
      var programmate = visits.filter(function (v) { return v.status === 'programmata'; });
      var html = '<div class="pl-card">' +
        '<h3><span class="card-icon">&#128197;</span> Prossima Visita</h3>';
      if (programmate.length > 0) {
        var next = programmate[0];
        html += '<div style="text-align:center;padding:.75rem 0">' +
          '<div style="font-size:1.8rem;font-weight:700;color:var(--primary)">' + fmtDate(next.scheduled_date) + '</div>' +
          (next.scheduled_time ? '<div style="font-size:1rem;color:var(--gray-600);margin-top:.2rem">ore ' + next.scheduled_time.slice(0, 5) + '</div>' : '') +
        '</div>';
        html += '<div class="pl-info-row"><span class="pl-info-label">Tipo visita</span><span class="pl-info-value">' + esc(VISIT_LABELS[next.visit_type] || next.visit_type) + '</span></div>';
        if (next.location) html += '<div class="pl-info-row"><span class="pl-info-label">Luogo</span><span class="pl-info-value">' + esc(next.location) + '</span></div>';
        html += '<div class="pl-info-row"><span class="pl-info-label">Stato</span><span class="pl-info-value"><span class="badge badge-info">' + esc(STATUS_LABELS[next.status] || next.status) + '</span></span></div>';
      } else {
        html += '<div class="pl-empty">Nessuna visita programmata</div>';
      }
      html += '</div>';
      return html;
    }

    function renderScadenzeCard(fitness, visits) {
      var html = '<div class="pl-card">' +
        '<h3><span class="card-icon">&#9200;</span> Scadenze</h3>';
      var nextVisitDate = fitness && fitness.next_visit_date ? fitness.next_visit_date : null;
      var programmate = visits.filter(function (v) { return v.status === 'programmata'; });
      var hasScadenze = nextVisitDate || programmate.length > 0;

      // Also check training expiry from cache
      var expiringTraining = cache.training.filter(function (t) {
        if (!t.expiry_date) return false;
        var d = daysUntil(t.expiry_date);
        return d !== null && d <= 60;
      });

      if (hasScadenze || expiringTraining.length > 0) {
        if (nextVisitDate) {
          var days = daysUntil(nextVisitDate);
          var urgStyle = days !== null && days < 0 ? 'color:#dc2626;font-weight:600' : days !== null && days <= 30 ? 'color:#ca8a04;font-weight:600' : '';
          html += '<div class="pl-scadenza-row"><span>Scadenza idoneit&agrave;</span><span style="' + urgStyle + '">' + fmtDate(nextVisitDate) + (days !== null ? ' (' + days + 'gg)' : '') + '</span></div>';
        }
        programmate.forEach(function (v) {
          html += '<div class="pl-scadenza-row"><span>' + esc(VISIT_LABELS[v.visit_type] || 'Visita') + '</span><span>' + fmtDate(v.scheduled_date) + '</span></div>';
        });
        expiringTraining.forEach(function (t) {
          var td = daysUntil(t.expiry_date);
          var style = td < 0 ? 'color:#dc2626;font-weight:600' : 'color:#ca8a04;font-weight:600';
          html += '<div class="pl-scadenza-row"><span>&#127891; ' + esc(t.course_name || t.training_type) + '</span><span style="' + style + '">' + fmtDate(t.expiry_date) + ' (' + td + 'gg)</span></div>';
        });
      } else {
        html += '<div class="pl-empty">Nessuna scadenza imminente</div>';
      }
      html += '</div>';
      return html;
    }

    function renderProtocolCard(data) {
      var html = '<div class="pl-card">' +
        '<h3><span class="card-icon">&#128203;</span> Protocollo Sanitario</h3>';
      if (data.protocol) {
        html += '<div style="font-size:.85rem;margin-bottom:.5rem"><strong>' + esc(data.protocol.protocol_name) + '</strong></div>';
        var exams = data.protocolExams || [];
        var completed = exams.filter(function (e) { return e.completed; }).length;
        var pct = exams.length > 0 ? Math.round((completed / exams.length) * 100) : 0;
        html += '<div style="width:100%;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-bottom:.35rem"><div style="height:100%;width:' + pct + '%;background:#16a34a;border-radius:4px"></div></div>';
        html += '<div style="font-size:.78rem;color:#6b7280;margin-bottom:.75rem">Esami completati: ' + completed + '/' + exams.length + ' (' + pct + '%)</div>';
        if (exams.length > 0) {
          html += '<div style="display:flex;flex-wrap:wrap;gap:.3rem">';
          exams.forEach(function (e) {
            var cls = e.completed ? 'badge-success' : 'badge-gray';
            html += '<span class="badge ' + cls + '" style="font-size:.72rem" title="' + esc(e.exam_name) + '">' + esc(e.exam_code) + '</span>';
          });
          html += '</div>';
        }
      } else {
        html += '<div class="pl-empty">Nessun protocollo assegnato</div>';
      }
      html += '</div>';
      return html;
    }

    // ── Tab Panels ──
    function renderVisitePanel(visits) {
      if (!visits.length) return '<div class="pl-empty">Nessuna visita registrata</div>';
      var html = '';
      // Group by status
      var programmate = visits.filter(function (v) { return v.status === 'programmata'; });
      var completate = visits.filter(function (v) { return v.status === 'completata'; });
      var altre = visits.filter(function (v) { return v.status !== 'programmata' && v.status !== 'completata'; });

      if (programmate.length > 0) {
        html += '<h4 style="font-size:.9rem;font-weight:600;color:var(--gray-700);margin-bottom:.5rem">&#128197; Visite Programmate</h4>';
        programmate.forEach(function (v) { html += visitRow(v); });
        html += '<div style="margin-bottom:1rem"></div>';
      }
      if (completate.length > 0) {
        html += '<h4 style="font-size:.9rem;font-weight:600;color:var(--gray-700);margin-bottom:.5rem">&#9989; Visite Completate</h4>';
        completate.forEach(function (v) { html += visitRow(v); });
        html += '<div style="margin-bottom:1rem"></div>';
      }
      if (altre.length > 0) {
        html += '<h4 style="font-size:.9rem;font-weight:600;color:var(--gray-700);margin-bottom:.5rem">Altre</h4>';
        altre.forEach(function (v) { html += visitRow(v); });
      }
      return html;
    }

    function visitRow(v) {
      var statusClass = v.status === 'completata' ? 'badge-success' : v.status === 'programmata' ? 'badge-info' : v.status === 'non_presentato' ? 'badge-danger' : 'badge-gray';
      return '<div class="pl-visit-item">' +
        '<div><span class="badge ' + statusClass + '">' + esc(STATUS_LABELS[v.status] || v.status) + '</span> ' +
        '<span style="margin-left:.5rem">' + esc(VISIT_LABELS[v.visit_type] || v.visit_type) + '</span></div>' +
        '<div>' + fmtDate(v.scheduled_date) + (v.scheduled_time ? ' <small>' + v.scheduled_time.slice(0, 5) + '</small>' : '') + '</div>' +
      '</div>';
    }

    function renderIdoneitaPanel(current, judgments) {
      var html = '';
      if (current) {
        html += '<h4 style="font-size:.9rem;font-weight:600;margin-bottom:.75rem">Idoneit&agrave; Corrente</h4>';
        var color = FITNESS_COLORS[current.judgment_type] || '#6b7280';
        html += '<div style="display:flex;align-items:center;gap:.75rem;padding:1rem;background:#f0f7ff;border-radius:10px;border-left:4px solid ' + color + ';margin-bottom:1rem">' +
          '<span class="semaforo" style="color:' + color + ';font-size:2rem">&#9679;</span>' +
          '<div>' +
            '<div style="font-weight:600;font-size:1rem;color:' + color + '">' + esc(FITNESS_LABELS[current.judgment_type] || current.judgment_type) + '</div>' +
            '<div style="font-size:.82rem;color:var(--gray-500)">Emesso il ' + fmtDate(current.issued_date) +
              (current.next_visit_date ? ' &mdash; Prossima visita: ' + fmtDate(current.next_visit_date) : '') +
            '</div>' +
          '</div>' +
        '</div>';
        if (current.prescriptions) {
          html += '<div style="padding:.5rem .75rem;background:#fef3c7;border-radius:6px;font-size:.82rem;margin-bottom:.5rem"><strong>Prescrizioni:</strong> ' + esc(current.prescriptions) + '</div>';
        }
        if (current.limitations) {
          html += '<div style="padding:.5rem .75rem;background:#fee2e2;border-radius:6px;font-size:.82rem;margin-bottom:.5rem"><strong>Limitazioni:</strong> ' + esc(current.limitations) + '</div>';
        }
      }

      if (judgments.length > 1) {
        html += '<h4 style="font-size:.9rem;font-weight:600;margin:1rem 0 .5rem">Storico Idoneit&agrave;</h4>';
        judgments.slice(current ? 1 : 0, 10).forEach(function (f) {
          var c = FITNESS_COLORS[f.judgment_type] || '#6b7280';
          html += '<div class="pl-scadenza-row">' +
            '<span style="color:' + c + ';font-weight:500">' + esc(FITNESS_LABELS[f.judgment_type] || f.judgment_type) + '</span>' +
            '<span>' + fmtDate(f.issued_date) + '</span>' +
          '</div>';
        });
      } else if (!current) {
        html += '<div class="pl-empty">Nessuna idoneit&agrave; registrata</div>';
      }
      return html;
    }

    function renderFormazionePanel(training) {
      if (!training.length) return '<div class="pl-empty">Nessun record di formazione</div>';
      var html = '';

      // Split by expiry status
      var expired = training.filter(function (t) { return t.expiry_date && daysUntil(t.expiry_date) < 0; });
      var expiring = training.filter(function (t) { return t.expiry_date && daysUntil(t.expiry_date) >= 0 && daysUntil(t.expiry_date) <= 60; });
      var valid = training.filter(function (t) { return !t.expiry_date || daysUntil(t.expiry_date) > 60; });

      if (expired.length > 0) {
        html += '<h4 style="font-size:.9rem;font-weight:600;color:var(--danger);margin-bottom:.5rem">&#9888; Formazione Scaduta</h4>';
        expired.forEach(function (t) { html += trainingRow(t); });
        html += '<div style="margin-bottom:1rem"></div>';
      }
      if (expiring.length > 0) {
        html += '<h4 style="font-size:.9rem;font-weight:600;color:var(--warning);margin-bottom:.5rem">&#9888; In Scadenza</h4>';
        expiring.forEach(function (t) { html += trainingRow(t); });
        html += '<div style="margin-bottom:1rem"></div>';
      }
      if (valid.length > 0) {
        html += '<h4 style="font-size:.9rem;font-weight:600;color:var(--success);margin-bottom:.5rem">&#9989; Formazione Valida</h4>';
        valid.forEach(function (t) { html += trainingRow(t); });
      }
      return html;
    }

    function trainingRow(t) {
      var expiryDays = t.expiry_date ? daysUntil(t.expiry_date) : null;
      var badge = '';
      if (expiryDays !== null) {
        if (expiryDays < 0) badge = '<span class="badge badge-danger">Scaduto</span>';
        else if (expiryDays <= 30) badge = '<span class="badge badge-warning">' + expiryDays + 'gg</span>';
        else badge = '<span class="badge badge-success">Valido</span>';
      }
      return '<div class="pl-training-item">' +
        '<div>' +
          '<strong>' + esc(t.course_name || '') + '</strong>' +
          '<div style="font-size:.75rem;color:var(--gray-500)">' +
            esc(TRAINING_LABELS[t.training_type] || t.training_type || '') +
            (t.provider ? ' &mdash; ' + esc(t.provider) : '') +
          '</div>' +
        '</div>' +
        '<div style="text-align:right">' +
          '<div style="font-size:.82rem">' + fmtDate(t.completion_date) + '</div>' +
          (t.expiry_date ? '<div style="font-size:.78rem;color:var(--gray-500)">Scad. ' + fmtDate(t.expiry_date) + '</div>' : '') +
          badge +
        '</div>' +
      '</div>';
    }

    function renderDatiPanel(w, currentJob, companyName, roleName) {
      var html = '<div class="pl-grid">';

      // Dati Anagrafici
      html += '<div class="pl-card">' +
        '<h3><span class="card-icon">&#128100;</span> Dati Anagrafici</h3>' +
        '<div class="pl-info-row"><span class="pl-info-label">Cognome Nome</span><span class="pl-info-value">' + esc(w.last_name + ' ' + w.first_name) + '</span></div>' +
        '<div class="pl-info-row"><span class="pl-info-label">Codice Fiscale</span><span class="pl-info-value"><code style="font-size:.78rem">' + esc(w.fiscal_code || '—') + '</code></span></div>' +
        '<div class="pl-info-row"><span class="pl-info-label">Data Nascita</span><span class="pl-info-value">' + fmtDate(w.date_of_birth) + '</span></div>' +
        (w.place_of_birth ? '<div class="pl-info-row"><span class="pl-info-label">Luogo Nascita</span><span class="pl-info-value">' + esc(w.place_of_birth) + '</span></div>' : '') +
        (w.gender ? '<div class="pl-info-row"><span class="pl-info-label">Sesso</span><span class="pl-info-value">' + esc(w.gender === 'M' ? 'Maschio' : w.gender === 'F' ? 'Femmina' : w.gender) + '</span></div>' : '') +
        (w.email ? '<div class="pl-info-row"><span class="pl-info-label">Email</span><span class="pl-info-value">' + esc(w.email) + '</span></div>' : '') +
        (w.phone ? '<div class="pl-info-row"><span class="pl-info-label">Telefono</span><span class="pl-info-value">' + esc(w.phone) + '</span></div>' : '') +
        (w.address_street ? '<div class="pl-info-row"><span class="pl-info-label">Indirizzo</span><span class="pl-info-value">' + esc(w.address_street) + (w.address_city ? ', ' + esc(w.address_city) : '') + (w.address_province ? ' (' + esc(w.address_province) + ')' : '') + '</span></div>' : '') +
      '</div>';

      // Dati Lavorativi
      html += '<div class="pl-card">' +
        '<h3><span class="card-icon">&#128188;</span> Dati Lavorativi</h3>' +
        '<div class="pl-info-row"><span class="pl-info-label">Azienda</span><span class="pl-info-value">' + esc(companyName) + '</span></div>' +
        '<div class="pl-info-row"><span class="pl-info-label">Mansione</span><span class="pl-info-value">' + esc(roleName) + '</span></div>' +
        (w.department ? '<div class="pl-info-row"><span class="pl-info-label">Reparto</span><span class="pl-info-value">' + esc(w.department) + '</span></div>' : '') +
        '<div class="pl-info-row"><span class="pl-info-label">Data Assunzione</span><span class="pl-info-value">' + fmtDate(w.hire_date) + '</span></div>' +
        '<div class="pl-info-row"><span class="pl-info-label">Contratto</span><span class="pl-info-value">' + esc(w.contract_type || '—') + '</span></div>' +
        (w.work_schedule ? '<div class="pl-info-row"><span class="pl-info-label">Orario</span><span class="pl-info-value">' + esc(w.work_schedule) + '</span></div>' : '') +
        (w.qualification ? '<div class="pl-info-row"><span class="pl-info-label">Qualifica</span><span class="pl-info-value">' + esc(w.qualification) + '</span></div>' : '') +
      '</div>';

      html += '</div>';
      return html;
    }

    // ── Tabs ──
    function initTabs() {
      var tabs = document.querySelectorAll('.pl-tab');
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) { t.classList.remove('active'); });
          document.querySelectorAll('.pl-panel').forEach(function (p) { p.classList.remove('active'); });
          tab.classList.add('active');
          var panel = $(tab.getAttribute('data-tab'));
          if (panel) panel.classList.add('active');
        });
      });
    }

    // ── Init ──
    function init() {
      var form = $('loginForm');
      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var email = $('loginEmail').value.trim();
          var password = $('loginPassword').value;
          var errEl = $('loginError');
          if (errEl) { errEl.classList.remove('visible'); errEl.textContent = ''; }
          $('loginBtn').disabled = true; $('loginBtn').textContent = 'Accesso...';

          api('POST', '/auth/login', { email: email, password: password }).then(function (r) {
            if (r.success) {
              saveSession(r.session, r.user);
              showApp();
              startAutoRefresh();
            } else {
              if (errEl) { errEl.textContent = r.error || 'Errore login'; errEl.classList.add('visible'); }
            }
          }).catch(function (err) {
            if (errEl) { errEl.textContent = err.message; errEl.classList.add('visible'); }
          }).finally(function () {
            $('loginBtn').disabled = false; $('loginBtn').textContent = 'Accedi';
          });
        });
      }

      $('logoutBtn').addEventListener('click', function () {
        clearSession(); showLogin();
      });

      if (loadSession()) { showApp(); startAutoRefresh(); }
      else { showLogin(); }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
