<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portale Azienda | Bio-Clinic MDL</title>
  <meta name="description" content="Portale Azienda - Sorveglianza Sanitaria D.Lgs. 81/2008">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/mdl.css?v=20260611d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .pa-hero{background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;padding:2rem;border-radius:12px;margin-bottom:1.5rem}
    .pa-hero h1{font-size:1.5rem;margin:0 0 .3rem}
    .pa-hero p{margin:0;opacity:.85;font-size:.9rem}
    .pa-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem}
    .pa-stat{background:#fff;border-radius:10px;padding:1rem;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);border-top:3px solid var(--primary)}
    .pa-stat-val{font-size:1.6rem;font-weight:700;color:var(--gray-900)}
    .pa-stat-label{font-size:.75rem;color:var(--gray-500);margin-top:.2rem}
    .pa-stat.stat-danger{border-top-color:var(--danger)}
    .pa-stat.stat-warning{border-top-color:var(--warning)}
    .pa-stat.stat-success{border-top-color:var(--success)}
    .pa-tabs{display:flex;gap:0;background:#fff;border-radius:10px 10px 0 0;box-shadow:0 1px 3px rgba(0,0,0,.05);border-bottom:2px solid var(--gray-200);overflow-x:auto;margin-bottom:0}
    .pa-tab{padding:.75rem 1.25rem;font-size:.82rem;font-weight:500;color:var(--gray-500);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;font-family:var(--font);white-space:nowrap}
    .pa-tab:hover{color:var(--gray-700)}
    .pa-tab.active{color:#0f766e;border-bottom-color:#0f766e;font-weight:600}
    .pa-panel{display:none;background:#fff;border-radius:0 0 10px 10px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:1.25rem}
    .pa-panel.active{display:block}
    .pa-search{display:flex;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap}
    .pa-search input,.pa-search select{padding:.5rem .75rem;border:1px solid var(--gray-300);border-radius:4px;font-size:.82rem;font-family:var(--font)}
    .pa-search input{flex:1;min-width:200px;max-width:320px}
    .pa-table{width:100%;border-collapse:collapse;font-size:.82rem}
    .pa-table thead{background:var(--gray-50)}
    .pa-table th{padding:.6rem .75rem;text-align:left;font-weight:600;color:var(--gray-600);font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--gray-200);white-space:nowrap}
    .pa-table td{padding:.55rem .75rem;border-bottom:1px solid var(--gray-100);color:var(--gray-700);vertical-align:middle}
    .pa-table tr:hover{background:var(--gray-50)}
    .pa-empty{text-align:center;padding:2rem;color:var(--gray-400);font-size:.85rem}
    .pa-doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
    .pa-doc-card{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:1rem;border-left:4px solid var(--gray-300)}
    .pa-doc-card.doc-ok{border-left-color:var(--success)}
    .pa-doc-card.doc-expired{border-left-color:var(--danger)}
    .pa-doc-card.doc-expiring{border-left-color:var(--warning)}
    .pa-doc-card.doc-missing{border-left-color:var(--gray-300);background:#fafafa}
    .pa-doc-title{font-weight:600;font-size:.88rem;margin-bottom:.3rem}
    .pa-doc-meta{font-size:.78rem;color:var(--gray-500)}
    .pa-nav{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1.25rem;background:#fff;border-bottom:1px solid var(--gray-200)}
    .pa-nav img{height:28px}
    .pa-footer{text-align:center;padding:2rem 1rem;color:var(--gray-400);font-size:.78rem}
    .deadline-badge{display:inline-block;padding:.1rem .5rem;border-radius:10px;font-size:.7rem;font-weight:500}
    .deadline-badge.scaduta{background:var(--danger-light);color:var(--danger)}
    .deadline-badge.urgente{background:var(--warning-light);color:var(--warning)}
    .deadline-badge.normale{background:var(--primary-light);color:var(--primary)}
    @media(max-width:768px){
      .pa-stats{grid-template-columns:repeat(2,1fr)}
      .pa-doc-grid{grid-template-columns:1fr}
      .pa-search{flex-direction:column}
      .pa-search input{max-width:none}
      .pa-table{font-size:.75rem}
      .pa-table th,.pa-table td{padding:.4rem .5rem}
    }
    @media(max-width:480px){
      .pa-stats{grid-template-columns:1fr 1fr}
      .pa-hero{padding:1.25rem}
      .pa-hero h1{font-size:1.2rem}
    }
  </style>
</head>
<body style="background:#f9fafb">

  <!-- Login -->
  <div id="loginPage" class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <img src="/images/logo-bio-clinic.png" alt="Bio-Clinic" width="160">
        <h2>Portale Azienda</h2>
        <p class="login-subtitle">Sorveglianza Sanitaria &mdash; D.Lgs. 81/2008</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="email@azienda.it" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="Password" required autocomplete="current-password">
        </div>
        <div id="loginError" class="login-error"></div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block" style="width:100%">Accedi</button>
      </form>
      <div style="margin-top:1rem;text-align:center;font-size:.82rem">
        <a href="/portale/" style="color:var(--primary)">Portale Lavoratore &rarr;</a>
        <span style="margin:0 .5rem;color:var(--gray-300)">|</span>
        <a href="/dashboard/" style="color:var(--primary)">Accesso operatori &rarr;</a>
      </div>
    </div>
  </div>

  <!-- App -->
  <div id="appShell" class="d-none" style="min-height:100vh;display:flex;flex-direction:column">
    <nav class="pa-nav">
      <div style="display:flex;align-items:center;gap:.75rem">
        <img src="/images/logo-bio-clinic.png" alt="Bio-Clinic">
        <span style="font-weight:600;font-size:.9rem;color:#0f766e">Portale Azienda</span>
      </div>
      <div style="display:flex;align-items:center;gap:1rem">
        <span id="userNameDisplay" style="font-size:.85rem;font-weight:500"></span>
        <span id="userRoleBadge" class="badge badge-info" style="font-size:.7rem"></span>
        <button class="btn btn-outline btn-sm" id="logoutBtn">Esci</button>
      </div>
    </nav>

    <main style="flex:1;max-width:1100px;width:100%;margin:0 auto;padding:1.5rem 1rem">
      <div id="portaleContent">
        <div style="text-align:center;padding:3rem;color:#9ca3af">Caricamento dati...</div>
      </div>
    </main>

    <footer class="pa-footer">
      Bio-Clinic S.r.l. &mdash; Portale Azienda &mdash; Medicina del Lavoro D.Lgs. 81/2008
    </footer>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script>
  (function () {
    'use strict';
    var API = '/api';
    var state = { session: null, user: null, companyId: null, companyName: '' };

    function $(id) { return document.getElementById(id); }
    function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    function show(el) { if (typeof el === 'string') el = $(el); if (el) el.classList.remove('d-none'); }
    function hide(el) { if (typeof el === 'string') el = $(el); if (el) el.classList.add('d-none'); }

    function toast(msg, type) {
      var c = $('toastContainer'); if (!c) return;
      var t = document.createElement('div');
      t.className = 'toast toast-' + (type || 'info');
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(function () { if (t.parentNode) t.remove(); }, 4000);
    }

    function api(method, path, body) {
      var opts = { method: method, headers: {} };
      if (state.session) opts.headers['Authorization'] = 'Bearer ' + state.session.access_token;
      if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      return fetch(API + path, opts).then(function (r) {
        if (r.status === 401) { clearSession(); showLogin(); throw new Error('Sessione scaduta'); }
        return r.json().then(function (data) {
          if (!r.ok) throw new Error(data.error || 'Errore');
          return data;
        });
      });
    }

    function fmtDate(d) {
      if (!d) return '—';
      return new Date(d).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function daysUntil(dateStr) {
      if (!dateStr) return null;
      var now = new Date(); now.setHours(0,0,0,0);
      var target = new Date(dateStr); target.setHours(0,0,0,0);
      return Math.ceil((target - now) / 86400000);
    }

    function deadlineBadge(days) {
      if (days === null) return '';
      if (days < 0) return '<span class="deadline-badge scaduta">Scaduta ' + Math.abs(days) + 'gg</span>';
      if (days <= 30) return '<span class="deadline-badge urgente">' + days + 'gg</span>';
      return '<span class="deadline-badge normale">' + days + 'gg</span>';
    }

    // ── Auth ──
    function loadSession() {
      try {
        var s = localStorage.getItem('mdl_session');
        var u = localStorage.getItem('mdl_user');
        if (s && u) { state.session = JSON.parse(s); state.user = JSON.parse(u); return true; }
      } catch (e) {}
      return false;
    }
    function saveSession(ses, usr) {
      state.session = ses; state.user = usr;
      localStorage.setItem('mdl_session', JSON.stringify(ses));
      localStorage.setItem('mdl_user', JSON.stringify(usr));
    }
    function clearSession() {
      state.session = null; state.user = null;
      localStorage.removeItem('mdl_session'); localStorage.removeItem('mdl_user');
    }
    function showLogin() { show('loginPage'); hide('appShell'); }
    function showApp() {
      hide('loginPage'); show('appShell');
      // Verify role
      if (!state.user || !['datore_lavoro', 'rspp', 'super_admin', 'medico_competente', 'medico_collaboratore', 'segreteria_mdl'].includes(state.user.role)) {
        toast('Accesso riservato a Datore di Lavoro / RSPP', 'error');
        clearSession(); showLogin();
        return;
      }
      state.companyId = state.user.company_id;
      loadPortaleData();
    }

    // Auto-refresh
    var refreshTimer = null;
    function startAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(function () {
        if (!state.session || !state.session.refresh_token) return;
        fetch(API + '/auth/refresh', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: state.session.refresh_token })
        }).then(function (r) { return r.json(); }).then(function (r) {
          if (r.success && r.session) {
            state.session.access_token = r.session.access_token;
            state.session.refresh_token = r.session.refresh_token;
            localStorage.setItem('mdl_session', JSON.stringify(state.session));
          }
        }).catch(function () {});
      }, 50 * 60 * 1000);
    }

    // ── Labels ──
    var ROLE_LABELS = { datore_lavoro: 'Datore di Lavoro', rspp: 'RSPP', super_admin: 'Super Admin', medico_competente: 'Medico Competente', medico_collaboratore: 'Med. Collaboratore', segreteria_mdl: 'Segreteria' };
    var FITNESS_LABELS = {
      idoneo: 'Idoneo', idoneo_con_prescrizioni: 'Idoneo c/ prescr.', idoneo_con_limitazioni: 'Idoneo c/ limit.',
      temporaneamente_non_idoneo: 'Temp. non idoneo', non_idoneo: 'Non idoneo'
    };
    var FITNESS_COLORS = {
      idoneo: '#16a34a', idoneo_con_prescrizioni: '#ca8a04', idoneo_con_limitazioni: '#ea580c',
      temporaneamente_non_idoneo: '#dc2626', non_idoneo: '#dc2626'
    };
    var VISIT_LABELS = {
      preventiva: 'Preventiva', periodica: 'Periodica', straordinaria: 'Straordinaria',
      cambio_mansione: 'Cambio Mansione', rientro_malattia: 'Rientro', cessazione: 'Cessazione', pre_assuntiva: 'Pre-Assuntiva'
    };
    var STATUS_LABELS = { programmata: 'Programmata', completata: 'Completata', non_presentato: 'Non presentato', annullata: 'Annullata' };

    // ── Data loading ──
    var cache = { workers: [], deadlines: [], visits: [], docs: [], training: [] };

    function loadPortaleData() {
      $('userNameDisplay').textContent = (state.user.first_name || '') + ' ' + (state.user.last_name || '');
      $('userRoleBadge').textContent = ROLE_LABELS[state.user.role] || state.user.role;

      // Load all data in parallel
      var p1 = api('GET', '/workers?limit=100').then(function (r) { cache.workers = r.data || []; }).catch(function () { cache.workers = []; });
      var p2 = api('GET', '/deadlines?horizon=180').then(function (r) { cache.deadlines = r.data || []; cache.deadlineCounts = r.counts || {}; }).catch(function () { cache.deadlines = []; cache.deadlineCounts = {}; });
      var p3 = api('GET', '/visits?limit=100').then(function (r) { cache.visits = r.data || []; }).catch(function () { cache.visits = []; });
      var p4 = state.companyId ? api('GET', '/companies/' + state.companyId + '/documents').then(function (r) { cache.docs = r.data || []; cache.docSlots = r.slots || []; }).catch(function () { cache.docs = []; cache.docSlots = []; }) : Promise.resolve();
      var p5 = api('GET', '/training?limit=100').then(function (r) { cache.training = r.data || []; }).catch(function () { cache.training = []; });

      Promise.all([p1, p2, p3, p4, p5]).then(function () {
        // Resolve company name from first worker
        if (cache.workers.length > 0 && cache.workers[0].mdl_companies) {
          state.companyName = cache.workers[0].mdl_companies.business_name || '';
        }
        renderPortale();
      });
    }

    function renderPortale() {
      var w = cache.workers;
      var dl = cache.deadlines;
      var vis = cache.visits;
      var dc = cache.deadlineCounts || {};

      // Count stats
      var totalWorkers = w.length;
      var scadute = dc.scadute || 0;
      var urgenti = dc.entro_30 || 0;
      var programmate = vis.filter(function (v) { return v.status === 'programmata'; }).length;
      var completate = vis.filter(function (v) { return v.status === 'completata'; }).length;

      var html = '<div class="pa-hero">' +
        '<h1>' + esc(state.companyName || 'La Tua Azienda') + '</h1>' +
        '<p>Portale Sorveglianza Sanitaria &mdash; ' + esc(ROLE_LABELS[state.user.role] || state.user.role) + '</p>' +
      '</div>';

      // Stats
      html += '<div class="pa-stats">' +
        '<div class="pa-stat"><div class="pa-stat-val">' + totalWorkers + '</div><div class="pa-stat-label">Dipendenti</div></div>' +
        '<div class="pa-stat stat-danger"><div class="pa-stat-val">' + scadute + '</div><div class="pa-stat-label">Scadenze Scadute</div></div>' +
        '<div class="pa-stat stat-warning"><div class="pa-stat-val">' + urgenti + '</div><div class="pa-stat-label">Scadenze 30gg</div></div>' +
        '<div class="pa-stat stat-success"><div class="pa-stat-val">' + programmate + '</div><div class="pa-stat-label">Visite Programmate</div></div>' +
      '</div>';

      // Tabs
      html += '<div class="pa-tabs">' +
        '<button class="pa-tab active" data-tab="tab-dipendenti">&#128100; Dipendenti</button>' +
        '<button class="pa-tab" data-tab="tab-scadenze">&#9200; Scadenze</button>' +
        '<button class="pa-tab" data-tab="tab-visite">&#128197; Visite</button>' +
        '<button class="pa-tab" data-tab="tab-documenti">&#128196; Documenti</button>' +
        '<button class="pa-tab" data-tab="tab-formazione">&#127891; Formazione</button>' +
      '</div>';

      // Tab panels
      html += renderDipendentiTab();
      html += renderScadenzeTab();
      html += renderVisiteTab();
      html += renderDocumentiTab();
      html += renderFormazioneTab();

      $('portaleContent').innerHTML = html;
      initTabs();
      initSearch();
    }

    // ── TAB: Dipendenti ──
    function renderDipendentiTab() {
      var w = cache.workers;
      var html = '<div id="tab-dipendenti" class="pa-panel active">';
      html += '<div class="pa-search"><input type="text" id="searchDip" placeholder="Cerca per cognome, nome, CF..."></div>';
      html += '<div id="dipTableWrap">';
      html += renderWorkersTable(w);
      html += '</div></div>';
      return html;
    }

    function renderWorkersTable(workers) {
      if (!workers.length) return '<div class="pa-empty">Nessun dipendente trovato</div>';
      var html = '<table class="pa-table"><thead><tr><th>Cognome Nome</th><th>Cod. Fiscale</th><th>Mansione</th><th>Reparto</th><th>Contratto</th><th>Assunzione</th></tr></thead><tbody>';
      workers.forEach(function (w) {
        var job = (w.mdl_worker_jobs || []).find(function (j) { return j.is_current; });
        var role = job && job.mdl_job_roles ? job.mdl_job_roles.role_name : '—';
        html += '<tr>' +
          '<td><strong>' + esc(w.last_name) + '</strong> ' + esc(w.first_name) + '</td>' +
          '<td><code style="font-size:.72rem">' + esc(w.fiscal_code || '—') + '</code></td>' +
          '<td>' + esc(role) + '</td>' +
          '<td>' + esc(w.department || '—') + '</td>' +
          '<td>' + esc(w.contract_type || '—') + '</td>' +
          '<td>' + fmtDate(w.hire_date) + '</td>' +
        '</tr>';
      });
      html += '</tbody></table>';
      return html;
    }

    // ── TAB: Scadenze ──
    function renderScadenzeTab() {
      var dl = cache.deadlines;
      var html = '<div id="tab-scadenze" class="pa-panel">';
      html += '<div class="pa-search">' +
        '<select id="filterScadCat"><option value="">Tutte le categorie</option><option value="visita">Visite</option><option value="documento">Documenti</option><option value="formazione">Formazione</option></select>' +
        '<select id="filterScadUrgenza"><option value="">Tutte le urgenze</option><option value="scaduta">Scadute</option><option value="30">Entro 30gg</option><option value="60">Entro 60gg</option></select>' +
      '</div>';
      html += '<div id="scadTableWrap">';
      html += renderDeadlinesTable(dl);
      html += '</div></div>';
      return html;
    }

    function renderDeadlinesTable(items) {
      if (!items.length) return '<div class="pa-empty">Nessuna scadenza trovata</div>';
      var html = '<table class="pa-table"><thead><tr><th>Scadenza</th><th>Tipo</th><th>Descrizione</th><th>Soggetto</th><th>Stato</th></tr></thead><tbody>';
      items.forEach(function (d) {
        var catLabel = d.category === 'visita' ? '&#128197; Visita' : d.category === 'documento' ? '&#128196; Documento' : '&#127891; Formazione';
        html += '<tr>' +
          '<td><strong>' + fmtDate(d.due_date) + '</strong></td>' +
          '<td>' + catLabel + '</td>' +
          '<td>' + esc(d.title) + '</td>' +
          '<td>' + esc(d.subject || '—') + '</td>' +
          '<td>' + deadlineBadge(d.days_until) + '</td>' +
        '</tr>';
      });
      html += '</tbody></table>';
      return html;
    }

    // ── TAB: Visite ──
    function renderVisiteTab() {
      var vis = cache.visits;
      var html = '<div id="tab-visite" class="pa-panel">';
      html += '<div class="pa-search">' +
        '<select id="filterVisStatus"><option value="">Tutti gli stati</option><option value="programmata">Programmate</option><option value="completata">Completate</option><option value="non_presentato">Non presentati</option></select>' +
      '</div>';
      html += '<div id="visTableWrap">';
      html += renderVisitsTable(vis);
      html += '</div></div>';
      return html;
    }

    function renderVisitsTable(visits) {
      if (!visits.length) return '<div class="pa-empty">Nessuna visita trovata</div>';
      var html = '<table class="pa-table"><thead><tr><th>Data</th><th>Ora</th><th>Lavoratore</th><th>Tipo</th><th>Stato</th><th>Luogo</th></tr></thead><tbody>';
      visits.forEach(function (v) {
        var worker = v.mdl_workers || {};
        var statusClass = v.status === 'completata' ? 'badge-success' : v.status === 'programmata' ? 'badge-info' : v.status === 'non_presentato' ? 'badge-danger' : 'badge-gray';
        html += '<tr>' +
          '<td>' + fmtDate(v.scheduled_date) + '</td>' +
          '<td>' + esc(v.scheduled_time ? v.scheduled_time.slice(0, 5) : '—') + '</td>' +
          '<td><strong>' + esc((worker.last_name || '') + ' ' + (worker.first_name || '')) + '</strong></td>' +
          '<td>' + esc(VISIT_LABELS[v.visit_type] || v.visit_type) + '</td>' +
          '<td><span class="badge ' + statusClass + '">' + esc(STATUS_LABELS[v.status] || v.status) + '</span></td>' +
          '<td>' + esc(v.location || '—') + '</td>' +
        '</tr>';
      });
      html += '</tbody></table>';
      return html;
    }

    // ── TAB: Documenti ──
    function renderDocumentiTab() {
      var html = '<div id="tab-documenti" class="pa-panel">';
      var slots = cache.docSlots || [];
      var docs = cache.docs || [];

      if (!slots.length && !docs.length) {
        html += '<div class="pa-empty">Nessun documento aziendale</div>';
        html += '</div>';
        return html;
      }

      html += '<div class="pa-doc-grid">';
      slots.forEach(function (slot) {
        var matching = docs.filter(function (d) { return d.description === slot.slot_key; });
        var latest = matching.length > 0 ? matching[0] : null;
        var statusCls = 'doc-missing';
        var statusLabel = 'Non caricato';

        if (latest) {
          if (latest.expiry_date) {
            var days = daysUntil(latest.expiry_date);
            if (days < 0) { statusCls = 'doc-expired'; statusLabel = 'Scaduto'; }
            else if (days <= 30) { statusCls = 'doc-expiring'; statusLabel = 'In scadenza'; }
            else { statusCls = 'doc-ok'; statusLabel = 'Valido'; }
          } else {
            statusCls = 'doc-ok'; statusLabel = 'Caricato';
          }
        }

        html += '<div class="pa-doc-card ' + statusCls + '">' +
          '<div class="pa-doc-title">' + esc(slot.label) + '</div>' +
          '<div class="pa-doc-meta">';
        if (latest) {
          html += '<span class="badge ' + (statusCls === 'doc-ok' ? 'badge-success' : statusCls === 'doc-expired' ? 'badge-danger' : statusCls === 'doc-expiring' ? 'badge-warning' : 'badge-gray') + '">' + statusLabel + '</span>';
          html += ' &nbsp; Caricato: ' + fmtDate(latest.created_at);
          if (latest.expiry_date) html += ' &mdash; Scadenza: ' + fmtDate(latest.expiry_date);
          if (latest.original_name) html += '<br>' + esc(latest.original_name);
        } else {
          html += '<span class="badge badge-gray">' + statusLabel + '</span>';
          html += ' &nbsp; Documento non ancora caricato.';
        }
        html += '</div></div>';
      });

      // Any other docs not matching known slots
      var knownSlots = slots.map(function (s) { return s.slot_key; });
      var extraDocs = docs.filter(function (d) { return !knownSlots.includes(d.description); });
      extraDocs.forEach(function (doc) {
        html += '<div class="pa-doc-card doc-ok">' +
          '<div class="pa-doc-title">' + esc(doc.title || doc.document_type) + '</div>' +
          '<div class="pa-doc-meta">' +
            '<span class="badge badge-success">Caricato</span> &nbsp; ' + fmtDate(doc.created_at) +
            (doc.expiry_date ? ' &mdash; Scadenza: ' + fmtDate(doc.expiry_date) : '') +
            (doc.original_name ? '<br>' + esc(doc.original_name) : '') +
          '</div></div>';
      });

      html += '</div></div>';
      return html;
    }

    // ── TAB: Formazione ──
    function renderFormazioneTab() {
      var tr = cache.training;
      var html = '<div id="tab-formazione" class="pa-panel">';
      html += '<div class="pa-search">' +
        '<input type="text" id="searchFormaz" placeholder="Cerca corso o lavoratore...">' +
      '</div>';
      html += '<div id="formazTableWrap">';
      html += renderTrainingTable(tr);
      html += '</div></div>';
      return html;
    }

    function renderTrainingTable(records) {
      if (!records.length) return '<div class="pa-empty">Nessun record di formazione</div>';
      var html = '<table class="pa-table"><thead><tr><th>Lavoratore</th><th>Corso</th><th>Tipo</th><th>Completato</th><th>Scadenza</th><th>Stato</th></tr></thead><tbody>';
      records.forEach(function (r) {
        var worker = r.mdl_workers || {};
        var company = worker.mdl_companies || {};
        var expiryDays = r.expiry_date ? daysUntil(r.expiry_date) : null;
        var expiryBadge = '';
        if (expiryDays !== null) {
          if (expiryDays < 0) expiryBadge = '<span class="badge badge-danger">Scaduto</span>';
          else if (expiryDays <= 30) expiryBadge = '<span class="badge badge-warning">In scadenza</span>';
          else expiryBadge = '<span class="badge badge-success">Valido</span>';
        } else {
          expiryBadge = '<span class="badge badge-gray">—</span>';
        }
        html += '<tr>' +
          '<td><strong>' + esc((worker.last_name || '') + ' ' + (worker.first_name || '')) + '</strong></td>' +
          '<td>' + esc(r.course_name || '—') + '</td>' +
          '<td>' + esc(r.training_type || '—') + '</td>' +
          '<td>' + fmtDate(r.completion_date) + '</td>' +
          '<td>' + (r.expiry_date ? fmtDate(r.expiry_date) : '—') + '</td>' +
          '<td>' + expiryBadge + '</td>' +
        '</tr>';
      });
      html += '</tbody></table>';
      return html;
    }

    // ── Tab switching ──
    function initTabs() {
      var tabs = document.querySelectorAll('.pa-tab');
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) { t.classList.remove('active'); });
          document.querySelectorAll('.pa-panel').forEach(function (p) { p.classList.remove('active'); });
          tab.classList.add('active');
          var panel = $(tab.getAttribute('data-tab'));
          if (panel) panel.classList.add('active');
        });
      });
    }

    // ── Search/filters ──
    function initSearch() {
      // Dipendenti search
      var searchDip = $('searchDip');
      if (searchDip) {
        searchDip.addEventListener('input', debounce(function () {
          var q = searchDip.value.toLowerCase().trim();
          var filtered = cache.workers.filter(function (w) {
            return !q || (w.last_name + ' ' + w.first_name + ' ' + (w.fiscal_code || '')).toLowerCase().indexOf(q) >= 0;
          });
          $('dipTableWrap').innerHTML = renderWorkersTable(filtered);
        }, 250));
      }

      // Scadenze filters
      var filterCat = $('filterScadCat');
      var filterUrg = $('filterScadUrgenza');
      function filterScadenze() {
        var cat = filterCat ? filterCat.value : '';
        var urg = filterUrg ? filterUrg.value : '';
        var filtered = cache.deadlines.filter(function (d) {
          if (cat && d.category !== cat) return false;
          if (urg === 'scaduta' && d.days_until >= 0) return false;
          if (urg === '30' && (d.days_until < 0 || d.days_until > 30)) return false;
          if (urg === '60' && (d.days_until < 0 || d.days_until > 60)) return false;
          return true;
        });
        $('scadTableWrap').innerHTML = renderDeadlinesTable(filtered);
      }
      if (filterCat) filterCat.addEventListener('change', filterScadenze);
      if (filterUrg) filterUrg.addEventListener('change', filterScadenze);

      // Visite filter
      var filterVis = $('filterVisStatus');
      if (filterVis) {
        filterVis.addEventListener('change', function () {
          var st = filterVis.value;
          var filtered = cache.visits.filter(function (v) { return !st || v.status === st; });
          $('visTableWrap').innerHTML = renderVisitsTable(filtered);
        });
      }

      // Formazione search
      var searchFormaz = $('searchFormaz');
      if (searchFormaz) {
        searchFormaz.addEventListener('input', debounce(function () {
          var q = searchFormaz.value.toLowerCase().trim();
          var filtered = cache.training.filter(function (r) {
            var w = r.mdl_workers || {};
            var text = (w.last_name || '') + ' ' + (w.first_name || '') + ' ' + (r.course_name || '') + ' ' + (r.training_type || '');
            return !q || text.toLowerCase().indexOf(q) >= 0;
          });
          $('formazTableWrap').innerHTML = renderTrainingTable(filtered);
        }, 250));
      }
    }

    function debounce(fn, delay) {
      var timer;
      return function () {
        clearTimeout(timer);
        timer = setTimeout(fn, delay);
      };
    }

    // ── Init ──
    function init() {
      var form = $('loginForm');
      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var email = $('loginEmail').value.trim();
          var password = $('loginPassword').value;
          var errEl = $('loginError');
          if (errEl) { errEl.classList.remove('visible'); errEl.textContent = ''; }
          $('loginBtn').disabled = true; $('loginBtn').textContent = 'Accesso...';

          api('POST', '/auth/login', { email: email, password: password }).then(function (r) {
            if (r.success) {
              saveSession(r.session, r.user);
              showApp();
              startAutoRefresh();
            } else {
              if (errEl) { errEl.textContent = r.error || 'Errore login'; errEl.classList.add('visible'); }
            }
          }).catch(function (err) {
            if (errEl) { errEl.textContent = err.message; errEl.classList.add('visible'); }
          }).finally(function () {
            $('loginBtn').disabled = false; $('loginBtn').textContent = 'Accedi';
          });
        });
      }

      $('logoutBtn').addEventListener('click', function () {
        clearSession(); showLogin();
      });

      if (loadSession()) { showApp(); startAutoRefresh(); }
      else { showLogin(); }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
